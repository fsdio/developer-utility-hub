name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, component, privacy & a11y tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Batas modul engine
        run: npm run check:boundaries

      - name: Budget bundle
        run: npm run check:bundle

      - name: Kontras warna WCAG AA
        run: npm run check:contrast

      - name: Smoke test base path GitHub Pages
        run: npm run preview:check
